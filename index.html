<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Can I Run Today? · Singapore</title>
<meta name="description" content="Should you run today? Live haze (PSI, PM2.5), heat stress, rain and lightning for every region of Singapore." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://can-i-run-sg.vercel.app/" />
<meta property="og:title" content="Can I Run Today? · Singapore" />
<meta property="og:description" content="Live haze, heat, rain and lightning for Singapore runners. A clear Yes, Maybe or Nope for your region." />
<meta property="og:image" content="https://can-i-run-sg.vercel.app/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="/icon-192.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#f5f9fc" id="themeColor" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Can I Run?" />
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="loading">
<header class="top">
  <div class="top-in">
    <div class="brand"><img src="/icon-192.png" alt="" /><span data-i18n="app.name">Can I Run?</span><small data-i18n="app.place">Singapore</small></div>
    <nav class="seg" aria-label="Language">
      <button data-lang="en" lang="en">EN</button><button data-lang="zh" lang="zh">中文</button><button data-lang="ms" lang="ms">BM</button><button data-lang="ta" lang="ta">தமிழ்</button>
    </nav>
    <button class="icon-btn" id="theme" data-i18n-aria="btn.theme" aria-label="Toggle dark mode"></button>
  </div>
</header>

<main class="wrap">
  <div id="installBar" class="notice" hidden>
    <span id="installText" data-i18n="install.text"></span>
    <button class="btn quiet" id="installBtn" hidden></button>
    <button class="btn quiet" id="installX" data-i18n-aria="install.dismiss" aria-label="Dismiss">✕</button>
  </div>

  <section class="card verdict" id="verdict" aria-live="polite">
    <div class="v-meta"><span id="regionName"></span><span id="updatedTop"></span></div>
    <div class="v-head"><span class="v-icon" id="vIcon"></span><h1 id="vText">&nbsp;</h1></div>
    <p class="v-lead" id="vSub" data-i18n="loading"></p>
    <ul class="v-reasons" id="reasons"></ul>
    <div class="keynums">
      <div class="kn"><div class="kn-label" data-i18n="key.psi"></div><div class="kn-val" id="sPsi"><span class="sk"></span></div><div class="kn-band" id="sPsiBand">&nbsp;</div></div>
      <div class="kn"><div class="kn-label" data-i18n="key.pm"></div><div class="kn-val"><span id="sPm"><span class="sk"></span></span><small data-i18n="unit.pm"></small></div><div class="kn-band" id="sPmBand">&nbsp;</div></div>
    </div>
    <div class="scene" id="scene" aria-hidden="true">
      <span class="orb"></span>
      <span class="cl c1"></span><span class="cl c2"></span><span class="cl c3"></span>
      <div class="scroll skyline"></div>
      <div class="scroll trees"></div>
      <div class="scroll ground"></div>
      <div class="runner-wrap"><span class="dust"></span><span class="dust d2"></span><span class="shadow"></span>
        <svg class="runner" viewBox="0 0 80 104">
          <g class="bob" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <!-- far side: slightly darker skin so it reads as "behind", not see-through -->
            <g class="far" style="--skin:#e2a06c">
              <g class="thigh">
                <line x1="38" y1="60" x2="38" y2="80" stroke="#0f2a44" stroke-width="10"/>
                <line x1="38" y1="60" x2="38" y2="80" class="sk2" stroke-width="5.5"/>
                <line x1="38" y1="59" x2="38" y2="67" stroke="#0f2a44" stroke-width="10.5"/>
                <g class="shin">
                  <line x1="38" y1="80" x2="38" y2="96" stroke="#0f2a44" stroke-width="9"/>
                  <line x1="38" y1="80" x2="38" y2="96" class="sk2" stroke-width="4.5"/>
                  <path d="M33 95 H47 Q53 95 53 100.5 H33 Z" fill="#fff" stroke="#0f2a44" stroke-width="2.5"/>
                  <path d="M37 97.5 H47" stroke="#ff7a59" stroke-width="2"/>
                </g>
              </g>
              <g class="uarm">
                <line x1="45" y1="35" x2="45" y2="47" stroke="#0f2a44" stroke-width="8"/>
                <line x1="45" y1="35" x2="45" y2="47" class="sk2" stroke-width="4"/>
                <g class="farm">
                  <line x1="45" y1="47" x2="45" y2="58" stroke="#0f2a44" stroke-width="8"/>
                  <line x1="45" y1="47" x2="45" y2="58" class="sk2" stroke-width="4"/>
                </g>
              </g></g>
            <line x1="46" y1="31" x2="39" y2="59" stroke="#0f2a44" stroke-width="17"/>
            <line x1="46" y1="31" x2="39" y2="59" stroke="#ff7a59" stroke-width="11"/>
            <circle cx="52" cy="18" r="10" fill="#ffcf9f" stroke="#0f2a44" stroke-width="3"/>
            <circle cx="57" cy="17" r="1.6" fill="#0f2a44"/>
            <path d="M43 12.5 L61 10.5" stroke="#2d9cdb" stroke-width="3"/>
            <path class="tail" d="M43 13 Q36 11 31 15" stroke="#2d9cdb" stroke-width="3"/>
            <g class="near" style="--skin:#ffcf9f">
              <g class="thigh">
                <line x1="38" y1="60" x2="38" y2="80" stroke="#0f2a44" stroke-width="10"/>
                <line x1="38" y1="60" x2="38" y2="80" class="sk2" stroke-width="5.5"/>
                <line x1="38" y1="59" x2="38" y2="67" stroke="#0f2a44" stroke-width="10.5"/>
                <g class="shin">
                  <line x1="38" y1="80" x2="38" y2="96" stroke="#0f2a44" stroke-width="9"/>
                  <line x1="38" y1="80" x2="38" y2="96" class="sk2" stroke-width="4.5"/>
                  <path d="M33 95 H47 Q53 95 53 100.5 H33 Z" fill="#fff" stroke="#0f2a44" stroke-width="2.5"/>
                  <path d="M37 97.5 H47" stroke="#ff7a59" stroke-width="2"/>
                </g>
              </g>
              <g class="uarm">
                <line x1="45" y1="35" x2="45" y2="47" stroke="#0f2a44" stroke-width="8"/>
                <line x1="45" y1="35" x2="45" y2="47" class="sk2" stroke-width="4"/>
                <g class="farm">
                  <line x1="45" y1="47" x2="45" y2="58" stroke="#0f2a44" stroke-width="8"/>
                  <line x1="45" y1="47" x2="45" y2="58" class="sk2" stroke-width="4"/>
                </g>
              </g></g>
          </g>
        </svg>
        <span class="meditate">🧘</span></div>
      <div class="rain"></div><div class="haze"></div><div class="flash"></div>
    </div>
  </section>

  <nav class="regions" id="regionRow" data-i18n-aria="regions.label" aria-label="Region"></nav>
  <div class="actions">
    <button class="btn quiet" id="locate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span data-i18n="btn.locate"></span></button>
    <button class="btn quiet" id="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span data-i18n="btn.refresh"></span></button>
    <button class="btn quiet" id="shareBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg><span data-i18n="share.btn"></span></button>
  </div>
  <div id="banner" class="notice" hidden></div>

  <div class="stack">
    <details class="card fold" id="more">
      <summary><h2 data-i18n="more.title"></h2><small id="moreTeaser"></small></summary>
      <div class="body"><dl class="rows" id="moreRows"></dl></div>
    </details>

    <details class="card fold" id="chart">
      <summary><h2><span data-i18n="chart.title"></span></h2><small id="bestTime"></small></summary>
      <div class="body"><div id="chartBody"></div></div>
    </details>

    <details class="card fold">
      <summary><h2 data-i18n="plan.title"></h2><small id="bestTomorrow"></small></summary>
      <div class="body">
        <div id="tomorrow"></div>
        <div class="outlook" id="outlook"></div>
        <p class="fine" data-i18n="plan.note"></p>
      </div>
    </details>

    <details class="card fold">
      <summary><h2 data-i18n="routes.title"></h2><small id="routesTeaser"></small></summary>
      <div class="body"><div class="routes" id="routes"></div></div>
    </details>
  </div>

  <!-- Quiet until the first run is logged -->
  <section class="card runs" id="runs">
    <h2 data-i18n="runs.title"></h2>
    <p id="runsLine"></p>
    <div class="btnrow">
      <button class="btn primary" id="ranBtn"></button>
      <button class="btn" id="indoorBtn"></button>
    </div>
    <details class="fold" id="calFold" hidden>
      <summary><h2 data-i18n="fold.cal"></h2><small id="badgeTeaser"></small></summary>
      <div class="body">
        <div class="cal-title" id="calTitle"></div>
        <div class="cal" id="cal"></div>
        <div class="badges" id="badges"></div>
        <div style="text-align:center"><button class="btn" id="recapBtn" data-i18n="runs.recap"></button></div>
      </div>
    </details>
  </section>

  <div class="stack" style="margin-top:10px">
    <details class="card fold" id="tipsCard">
      <summary><h2 data-i18n="fold.tips"></h2><small id="tipsTitle"></small></summary>
      <div class="body">
        <ul class="tips" id="tips"></ul>
        <button class="btn quiet" id="excuse" data-i18n="excuse.btn" style="padding-left:0"></button>
        <p id="excuseText" class="fine" style="font-style:italic;margin-top:0"></p>
      </div>
    </details>

    <details class="card fold explain">
      <summary><h2 data-i18n="explain.title"></h2><small data-i18n="fold.explainTeaser"></small></summary>
      <div class="body">
        <dl style="margin:0">
          <dt data-i18n="explain.psi.t"></dt><dd data-i18n-html="explain.psi.d"></dd>
          <dt data-i18n="explain.pm.t"></dt><dd data-i18n-html="explain.pm.d"></dd>
          <dt data-i18n="explain.heat.t"></dt><dd data-i18n-html="explain.heat.d"></dd>
          <dt data-i18n="explain.lightning.t"></dt><dd data-i18n-html="explain.lightning.d"></dd>
          <dt data-i18n="explain.how.t"></dt><dd data-i18n-html="explain.how.d"></dd>
        </dl>
      </div>
    </details>
  </div>

  <footer>
    <p><span data-i18n-html="footer.data"></span> · <span id="updated"></span></p>
    <p data-i18n-html="footer.note"></p>
  </footer>
</main>

<div id="tip"></div>
<div id="toast" role="status"></div>
<div id="modal" class="modal" hidden>
  <div class="card modal-box">
    <button class="icon-btn modal-x" id="modalClose" aria-label="Close">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
