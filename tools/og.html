<!DOCTYPE html>
<html><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; width: 1200px; height: 630px; background: #f5f9fc; font-family: Inter, sans-serif; color: #0f2a44; display: flex; align-items: center; padding: 0 90px; box-sizing: border-box; gap: 70px; }
  .l { flex: 1; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 28px; color: #5b7085; }
  .brand img { width: 52px; height: 52px; border-radius: 13px; }
  h1 { font-size: 76px; line-height: 1.02; letter-spacing: -.035em; margin: 28px 0 18px; font-weight: 800; }
  p { font-size: 28px; color: #5b7085; margin: 0; line-height: 1.4; }
  .card { width: 380px; background: #fff; border: 1px solid #dbe5ee; border-radius: 28px; box-shadow: 0 10px 40px rgba(15,42,68,.1); padding: 34px; position: relative; overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0 0 auto; height: 8px; background: #1e9e5a; }
  .meta { color: #5b7085; font-size: 20px; font-weight: 500; }
  .v { font-size: 92px; font-weight: 800; color: #1e9e5a; letter-spacing: -.04em; margin: 8px 0 4px; }
  .lead { font-size: 22px; font-weight: 500; }
  .nums { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
  .n { background: #eef4f9; border-radius: 16px; padding: 16px; } .n span { color: #5b7085; font-size: 17px; font-weight: 600; } .n b { display: block; font-size: 44px; }
</style></head>
<body>
  <div class="l">
    <div class="brand"><img src="../icon-512.png" />Can I Run? · Singapore</div>
    <h1>Should you run today?</h1>
    <p>Live haze, heat, rain and lightning from NEA, turned into a clear Yes, Maybe or Nope for your region.</p>
  </div>
  <div class="card">
    <div class="meta">East Singapore</div>
    <div class="v">Yes</div>
    <div class="lead">Conditions look good for running.</div>
    <div class="nums"><div class="n"><span>24-hr PSI</span><b>42</b></div><div class="n"><span>1-hr PM2.5</span><b>14</b></div></div>
  </div>
</body></html>
